[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baileys"
version = "7.0.0rc14"
description = "Python port of WhiskeySockets/Baileys - WhatsApp Web multi-device API over WebSocket"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["whatsapp", "baileys", "whatsapp-web", "bot", "asyncio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "protobuf>=5",
  "websockets>=13",
  "cryptography>=42",
  "httpx>=0.27",
  "pillow>=10",
  "mutagen>=1.47",
  "qrcode>=7",
]

[project.optional-dependencies]
qr = []   # kept for backwards compatibility: qrcode is now a core dependency
redis = ["redis>=5"]
dev = ["pytest", "grpcio-tools"]

[project.urls]
Homepage = "https://github.com/ChillatoOfficial/baileys"
Documentation = "https://github.com/ChillatoOfficial/baileys/blob/main/DOCS.md"
Issues = "https://github.com/ChillatoOfficial/baileys/issues"
Upstream = "https://github.com/WhiskeySockets/Baileys"

[tool.setuptools.packages.find]
include = ["baileys*"]

[tool.setuptools.package-data]
baileys = ["WAProto/*.proto", "WAM/*.json", "py.typed"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
